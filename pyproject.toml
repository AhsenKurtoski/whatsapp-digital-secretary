[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gina-whatsapp-secretary"
version = "1.4.0"
description = "Segreteria WhatsApp self-hosted con approvazioni, preventivi PDF e dashboard privata"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = [".git", "node_modules", "google-bridge/Code.gs", "dashboard.html"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "B023"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = false
disallow_untyped_defs = false
warn_unused_ignores = false
exclude = ["tests/", "google-bridge/", "demo.py"]

[tool.coverage.run]
branch = true
source = [
  "lead_intel", "memory", "cache", "identity", "quotas", "router", "webhooks",
  "stats", "conversations", "gdpr", "backup", "live", "setup_wizard",
  "approval_store", "gateway_policy", "quote_pdf", "config", "remote_access",
  "site_build", "seo_audit",
]
omit = ["*/tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 86
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]

[tool.bandit]
exclude_dirs = ["tests", "node_modules", ".git"]

[tool.bandit.assert_used]
skips = ["*_test.py", "test_*.py"]
