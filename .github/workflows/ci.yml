name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  # Ogni lunedì alle 06:00 UTC: `cryptography` ha un intervallo di versioni
  # (`>=42,<51`), quindi una CVE pubblicata dopo l'ultimo push non la vedrebbe
  # nessuno. Sulla run schedulata girano solo `quality` (che include pip-audit)
  # e `security`: rifare 4 matrici Python identiche sarebbe solo rumore.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# Una nuova push sullo stesso branch/PR annulla la run precedente. Sul branch
# principale e sulle run schedulate non si annulla nulla.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Tests (Python ${{ matrix.python }})
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m py_compile *.py google-bridge/*.py scripts/*.py

      - name: Relative links
        run: python link_check.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Test isolated installer
        run: python -m unittest discover -s tests -p 'test_install.py' -v

      - name: Run every self-test
        run: |
          python monitor.py --self-test
          python watchdog.py --self-test
          python healthcheck.py --self-test
          python contacts.py --self-test
          python reminders.py --self-test
          python gateway_policy.py --self-test
          python doctor.py --self-test
          python remote_access.py --self-test

      - name: Test signed bridge client
        run: python google-bridge/test_bridge.py

      - name: Generate a demo quote PDF
        run: python quote_pdf.py /tmp/preventivo-demo.pdf

  apps-script:
    name: Apps Script bridge test
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Test Code.gs handlers
        run: node google-bridge/test_code_gs.js

      - name: Test inbound and outbound guard
        run: node plugins/secretary-guard/test_guard.js

  quality:
    name: Lint, types, security, coverage
    # Gira anche sulla run settimanale: è qui che `pip-audit` scopre una CVE
    # nuova delle dipendenze runtime.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dev tools
        run: python -m pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check .

      - name: Mypy (nuovi moduli)
        run: >-
          mypy --config-file pyproject.toml --follow-imports=skip
          lead_intel.py memory.py cache.py identity.py quotas.py router.py
          webhooks.py stats.py conversations.py gdpr.py backup.py setup_wizard.py
          site_build.py seo_audit.py

      - name: Bandit (medium/high)
        run: bandit -q -c pyproject.toml -r . -x tests,node_modules,google-bridge -lll

      - name: pip-audit
        run: pip-audit -r requirements-dev.txt

      - name: Public site build and SEO audit
        run: |
          python site_build.py --self-test
          python seo_audit.py --self-test
          python -m unittest discover -s tests -p 'test_site.py' -v

      - name: Coverage (soglia 86%)
        run: bash scripts/coverage.sh

  shell:
    name: Shell syntax
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check shell scripts
        run: |
          for file in scripts/*.sh google-bridge/*.sh; do
            bash -n "$file"
          done

      - name: Test hello-world plugin
        run: |
          node --input-type=module -e '
          import define from "./examples/hello-plugin/index.js";
          const hooks = [];
          define({ config: {}, log: () => {}, on: (name) => hooks.push(name) });
          if (hooks.join(",") !== "before_dispatch,message_sending,agent_end") process.exit(1);
          console.log("hello-plugin: OK");
          '

  security:
    name: Segreti nella storia (gitleaks)
    # Sempre: è il controllo che deve restare verde anche senza push.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Tutta la storia: un segreto committato mesi fa resta leggibile
          # anche dopo la rimozione dal file attuale.
          fetch-depth: 0

      - name: gitleaks
        shell: bash
        run: |
          if ! command -v gitleaks >/dev/null 2>&1; then
            version=8.24.3
            curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz" \
              | tar -xz -C /usr/local/bin gitleaks
          fi
          gitleaks detect --source . --config .gitleaks.toml --redact --no-banner --exit-code 1
