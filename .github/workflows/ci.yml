name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Compile Python sources
        run: python -m py_compile *.py google-bridge/*.py scripts/*.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Test isolated installer
        run: python -m unittest discover -s tests -p 'test_install.py' -v

      - name: Run every self-test
        run: |
          python monitor.py --self-test
          python watchdog.py --self-test
          python healthcheck.py --self-test
          python contacts.py --self-test
          python reminders.py --self-test
          python gateway_policy.py --self-test
          python doctor.py --self-test
          python remote_access.py --self-test

      - name: Test signed bridge client
        run: python google-bridge/test_bridge.py

      - name: Generate a demo quote PDF
        run: python quote_pdf.py /tmp/preventivo-demo.pdf

  apps-script:
    name: Apps Script bridge test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Test Code.gs handlers
        run: node google-bridge/test_code_gs.js

      - name: Test inbound and outbound guard
        run: node plugins/secretary-guard/test_guard.js

  quality:
    name: Lint, types, security, coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dev tools
        run: python -m pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check .

      - name: Mypy (nuovi moduli)
        run: >-
          mypy --config-file pyproject.toml --follow-imports=skip
          lead_intel.py memory.py cache.py identity.py quotas.py router.py
          webhooks.py stats.py conversations.py gdpr.py backup.py setup_wizard.py

      - name: Bandit (medium/high)
        run: bandit -q -c pyproject.toml -r . -x tests,node_modules,google-bridge -lll

      - name: pip-audit
        run: pip-audit -r requirements-dev.txt

      - name: Coverage (soglia 80%)
        run: bash scripts/coverage.sh

  shell:
    name: Shell syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check shell scripts
        run: |
          for file in scripts/*.sh docker-entrypoint.sh google-bridge/*.sh; do
            bash -n "$file"
          done

      - name: Test hello-world plugin
        run: |
          node --input-type=module -e '
          import define from "./examples/hello-plugin/index.js";
          const hooks = [];
          define({ config: {}, log: () => {}, on: (name) => hooks.push(name) });
          if (hooks.join(",") !== "before_dispatch,message_sending,agent_end") process.exit(1);
          console.log("hello-plugin: OK");
          '
