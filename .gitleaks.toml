# Configurazione gitleaks (CI → job "security").
#
# Restano attive tutte le regole di default: qui sotto ci sono solo i due falsi
# positivi verificati a mano, con il motivo. Non aggiungere voci senza aver
# prima controllato il valore: un'allowlist sbagliata spegne il controllo.

[extend]
useDefault = true

[allowlist]
description = "Falsi positivi verificati: non sono credenziali."

