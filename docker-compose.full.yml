# Gina full stack: OpenClaw + gateway WhatsApp + dashboard.
#
#   docker compose -f docker-compose.full.yml up -d --build
#
# Prima di avviarlo leggi docs/DOCKER.md: dentro un container non c'è systemd,
# quindi watchdog e timer non sono attivi e il login WhatsApp richiede il QR
# dall'interfaccia di controllo. La dashboard resta su 127.0.0.1.
services:
  openclaw:
    build:
      context: .
      dockerfile: docker/Dockerfile.openclaw
    container_name: gina-openclaw
    restart: unless-stopped
    environment:
      OPENCLAW_HOME: /data/openclaw
      OPENCLAW_STATE_DIR: /data/openclaw/state
      OPENCLAW_CONFIG_PATH: /data/openclaw/openclaw.json
      HOME: /data
    volumes:
      - openclaw-data:/data
      - ./docker/openclaw.json.example:/data/openclaw/openclaw.json:ro
    ports:
      # Interfaccia di controllo solo su loopback dell'host.
      - "127.0.0.1:18789:18789"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:18789/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gina-dashboard
    restart: unless-stopped
    depends_on:
      openclaw:
        condition: service_healthy
    environment:
      SECRETARY_BASE: /data/secretary
      SECRETARY_CONFIG: /data/config/config.json
      OPENCLAW_CONFIG: /data/openclaw/openclaw.json
      DASHBOARD_HOST: 127.0.0.1
      DASHBOARD_PORT: "8787"
    volumes:
      - secretary-data:/data
      - openclaw-data:/data/openclaw:ro
    ports:
      # Mai 0.0.0.0: la dashboard contiene dati dei clienti.
      - "127.0.0.1:8787:8787"

volumes:
  openclaw-data:
  secretary-data:
